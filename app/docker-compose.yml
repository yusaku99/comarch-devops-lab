services:
  loyalty-web:
    build: .
    container_name: comarch-loyalty-web
    ports:
      - "8080:80"
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: comarch-blackbox
    ports:
      - "9115:9115"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: comarch-prometheus
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - loyalty-web
    restart: unless-stopped
