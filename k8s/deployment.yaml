apiVersion: apps/v1
kind: Deployment
metadata:
  name: comarch-loyalty-web
  labels:
    app: comarch-loyalty-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: comarch-loyalty-web
  template:
    metadata:
      labels:
        app: comarch-loyalty-web
    spec:
      containers:
        - name: loyalty-web
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5